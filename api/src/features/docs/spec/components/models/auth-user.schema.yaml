type: object
required:
  [id, email, displayName, avatarUrl, timezone, hasPassword, identities, phone, isDemo, createdAt]
properties:
  id:
    type: string
    description: UUIDv7
    example: 01929b6e-5c3a-7c2e-9f1a-3b4c5d6e7f80
  email:
    type: string
    format: email
    example: mom@example.com
  displayName:
    type: string
    description: >-
      The email's local part, or the Google name when the account was created through Google
    example: mom
  avatarUrl:
    type: [string, 'null']
    description: The Google picture when the account was created (or linked) through Google
    example: null
  timezone:
    type: string
    example: Asia/Bangkok
  hasPassword:
    type: boolean
    description: Whether the user has set a password (and can sign in with it)
    example: false
  identities:
    type: array
    description: Linked sign-in providers, oldest first; empty when none
    items:
      $ref: './auth-identity.schema.yaml'
  phone:
    type: [string, 'null']
    description: The verified mobile number in E.164 (auth spec rule 25), or null
    example: '+66812345678'
  isDemo:
    type: boolean
    description: >-
      A demo account (demo spec): seeded data, deleted 24 hours after `createdAt`, and no
      credential, phone, sharing or delete routes (`403 DEMO_NOT_ALLOWED`). Its `email` is a
      placeholder (`demo-<id>@demo.invalid`) no mail can reach.
    example: false
  createdAt:
    type: string
    format: date-time
    description: When the account was made; a demo's hours left count from it (demo rule 10)
    example: '2026-11-17T05:00:00.000Z'
