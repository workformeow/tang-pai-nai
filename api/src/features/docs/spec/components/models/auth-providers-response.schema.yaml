type: object
required: [message, timestamp, data]
properties:
  message:
    type: string
    example: Sign-in providers
  timestamp:
    type: string
    format: date-time
    example: '2026-01-01T00:00:00.000Z'
  data:
    type: object
    required: [google, phone, botCheckSiteKey, testVersion, demo]
    properties:
      google:
        type: boolean
        description: >-
          Whether Google sign-in is on (`GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET` are set)
        example: true
      phone:
        type: boolean
        description: >-
          Whether phone sign-in and adding a number are on (`SMS_PROVIDER` isn't `disabled`)
        example: true
      botCheckSiteKey:
        type: string
        nullable: true
        description: The Turnstile site key the web renders its widget with; `null` while it's off
        example: null
      testVersion:
        type: boolean
        description: >-
          Whether the app says it is a test version on the sign-in and privacy pages
          (`TEST_VERSION`, privacy spec rule 2)
        example: true
      demo:
        type: boolean
        description: >-
          Whether ทดลองใช้ Demo is on (`DEMO_ENABLED`, demo rule 1): the sign-in page's link and
          `POST /auth/demo`
        example: true
