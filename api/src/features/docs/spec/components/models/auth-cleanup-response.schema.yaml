type: object
required: [message, timestamp, data]
properties:
  message:
    type: string
    example: Operation successful
  timestamp:
    type: string
    format: date-time
    example: '2026-01-01T00:00:00.000Z'
  data:
    type: object
    required: [challenges, sessions, rateLimitBuckets, invites, demoUsers]
    properties:
      challenges:
        type: integer
        example: 12
      sessions:
        type: integer
        example: 3
      rateLimitBuckets:
        type: integer
        example: 40
      invites:
        type: integer
        description: Wallet invites more than 7 days past expiry (they hold someone's email)
        example: 1
      demoUsers:
        type: integer
        description: Demo users created more than 24 hours ago, deleted with all their data
        example: 2
