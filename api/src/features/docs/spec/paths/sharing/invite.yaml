delete:
  tags:
    - Sharing
  summary: 'Cancel an invite'
  description: >-
    The owner cancels a pending invite.
  operationId: sharingCancelInvite
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    '200':
      description: 'Done'
      content:
        application/json:
          schema:
            $ref: '../../components/models/message-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
    '403':
      description: '`DEMO_NOT_ALLOWED`: a demo account can’t share (demo rule 9)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '404':
      description: 'Not the caller’s to see (404 hides whether it exists)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
