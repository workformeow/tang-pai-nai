get:
  tags:
    - Auth
  summary: What deleting the account takes with it
  description: >-
    Read by the delete page before anything can be pressed (privacy spec rules 5 and 10): how
    many people the caller's shared wallets reach.
  operationId: accountDeletion
  security:
    - bearerAuth: []
  responses:
    '200':
      description: The summary
      content:
        application/json:
          schema:
            $ref: '../../components/models/auth-account-deletion-response.schema.yaml'
    '401':
      description: Access token invalid, or its session was revoked or expired
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '403':
      description: '`DEMO_NOT_ALLOWED`: a demo account is ended with DELETE /auth/demo (demo rule 9)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
