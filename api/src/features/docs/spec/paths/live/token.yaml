post:
  tags:
    - Live
  summary: How this device listens for pokes
  description: >-
    Answers the API's live provider (docs/features/live-sync.md rule 8). With `ably`, a token
    request the Ably SDK exchanges for a subscribe-only token; it calls again for each new token.
  operationId: liveToken
  security:
    - bearerAuth: []
  responses:
    '200':
      description: The provider, and an Ably token request with `ably`
      content:
        application/json:
          schema:
            $ref: '../../components/models/live-token-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
